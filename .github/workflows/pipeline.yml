name: FINN pipeline

# Ingest EOD prices + new filings -> classify -> results cards -> bios -> alerts.
# Every 2 hours, 09:30-21:30 IST on weekdays (filings land through the day;
# EOD prices are final after ~16:00 IST), plus a Saturday morning catch-up.
# Each stage is incremental: a run with nothing new makes no LLM calls.
on:
  schedule:
    - cron: "0 4-16/2 * * 1-5"   # UTC -> 09:30, 11:30 ... 21:30 IST
    - cron: "30 2 * * 6"         # Sat 08:00 IST
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional space-separated NSE symbols (default: full universe)"
        required: false

concurrency:
  group: finn-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m finn.jobs.pipeline ${{ github.event.inputs.symbols }}
